<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投研看盘 · Watchlist</title>
<style>
  :root {
    --paper:#E7ECF1; --panel:#F5F7FA; --panel2:#EDF1F5;
    --ink:#14212E; --soft:#47586A; --faint:#7A8898;
    --line:#C3CCD6; --lineS:#93A2B0;
    --accent:#0A6FB8; --accentInk:#08517F; --accentSoft:#E1EDF7;
    --good:#1B9C67; --warn:#B9821A; --crit:#C34038;
    --goodBg:rgba(27,156,103,.12); --accBg:rgba(10,111,184,.10); --warnBg:rgba(185,130,26,.12); --critBg:rgba(195,64,56,.12);
    --areaFill:rgba(10,111,184,.16);
    --grid:rgba(16,64,110,0.055);
    --shadow:0 1px 2px rgba(20,40,70,.06), 0 12px 40px rgba(20,40,70,.10);
    --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#0A131C; --panel:#0F1C27; --panel2:#13222F;
      --ink:#E4ECF3; --soft:#9EB1C1; --faint:#64768A;
      --line:#22333F; --lineS:#38505F;
      --accent:#2E9BE0; --accentInk:#6FC0F0; --accentSoft:#12293B;
      --good:#33C089; --warn:#E0A83A; --crit:#E8635C;
      --goodBg:rgba(51,192,137,.14); --accBg:rgba(46,155,224,.12); --warnBg:rgba(224,168,58,.14); --critBg:rgba(232,99,92,.14);
      --areaFill:rgba(46,155,224,.18);
      --grid:rgba(90,150,210,0.06);
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 18px 50px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="light"] {
    --paper:#E7ECF1; --panel:#F5F7FA; --panel2:#EDF1F5;
    --ink:#14212E; --soft:#47586A; --faint:#7A8898;
    --line:#C3CCD6; --lineS:#93A2B0;
    --accent:#0A6FB8; --accentInk:#08517F; --accentSoft:#E1EDF7;
    --good:#1B9C67; --warn:#B9821A; --crit:#C34038;
    --goodBg:rgba(27,156,103,.12); --accBg:rgba(10,111,184,.10); --warnBg:rgba(185,130,26,.12); --critBg:rgba(195,64,56,.12);
    --areaFill:rgba(10,111,184,.16);
    --grid:rgba(16,64,110,0.055);
    --shadow:0 1px 2px rgba(20,40,70,.06), 0 12px 40px rgba(20,40,70,.10);
  }
  :root[data-theme="dark"] {
    --paper:#0A131C; --panel:#0F1C27; --panel2:#13222F;
    --ink:#E4ECF3; --soft:#9EB1C1; --faint:#64768A;
    --line:#22333F; --lineS:#38505F;
    --accent:#2E9BE0; --accentInk:#6FC0F0; --accentSoft:#12293B;
    --good:#33C089; --warn:#E0A83A; --crit:#E8635C;
    --goodBg:rgba(51,192,137,.14); --accBg:rgba(46,155,224,.12); --warnBg:rgba(224,168,58,.14); --critBg:rgba(232,99,92,.14);
    --areaFill:rgba(46,155,224,.18);
    --grid:rgba(90,150,210,0.06);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 18px 50px rgba(0,0,0,.45);
  }

  * { box-sizing:border-box; }
  body {
    margin:0; font-family:var(--sans); color:var(--ink); line-height:1.5;
    background-color:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:22px 22px;
    padding:clamp(10px,2vw,28px); display:flex; justify-content:center;
  }
  .sheet { width:100%; max-width:1180px; background:var(--panel); border:1px solid var(--lineS); box-shadow:var(--shadow); position:relative; }
  .sheet::before,.sheet::after { content:""; position:absolute; width:12px; height:12px; pointer-events:none; }
  .sheet::before { top:6px; left:6px; border-top:1.5px solid var(--accent); border-left:1.5px solid var(--accent); }
  .sheet::after { bottom:6px; right:6px; border-bottom:1.5px solid var(--accent); border-right:1.5px solid var(--accent); }

  header { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; padding:clamp(14px,2.5vw,24px); border-bottom:1px solid var(--line);
           background:linear-gradient(180deg,var(--accentSoft),transparent 90%); flex-wrap:wrap; }
  .eyebrow { font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--faint); }
  h1 { margin:4px 0 0; font-size:clamp(20px,3.4vw,28px); font-weight:800; letter-spacing:-.01em; }
  .hdr-right { text-align:right; font-family:var(--mono); font-size:11.5px; color:var(--soft); }
  .hdr-right .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--good); margin-right:6px; }
  .hdr-right .dot.err { background:var(--crit); }
  button.theme { margin-top:6px; font-family:var(--mono); font-size:11px; background:var(--panel2); color:var(--soft);
                 border:1px solid var(--line); padding:4px 10px; cursor:pointer; border-radius:2px; }
  button.theme:focus-visible, .ptab:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  section { padding:clamp(10px,2vw,20px) clamp(12px,2.5vw,24px); }
  .sec-label { display:flex; align-items:center; gap:10px; margin:6px 0 10px; }
  .sec-label .txt { font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); }
  .sec-label .rule { flex:1; height:1px; background:var(--line); }

  .card { display:grid; grid-template-columns: 300px 1fr; gap:0; border:1px solid var(--line); margin-bottom:10px; background:var(--panel2); }
  .left { padding:14px; border-right:1px solid var(--line); display:flex; flex-direction:column; gap:10px; }
  .who .nm { font-weight:700; font-size:15px; }
  .who .cd { font-family:var(--mono); font-size:10.5px; color:var(--faint); }
  .who .watch { font-size:11px; color:var(--soft); margin-top:4px; line-height:1.5; }

  .pxline { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .px { font-family:var(--mono); font-variant-numeric:tabular-nums; }
  .px .p { font-size:21px; font-weight:800; }
  .px .chg { font-size:12px; font-weight:700; margin-left:2px; }
  .px .chg.up { color:var(--good); } .px .chg.dn { color:var(--crit); } .px .chg.flat { color:var(--faint); }
  .meta { font-size:10px; color:var(--faint); font-family:var(--mono); }
  .meta .warnsrc { color:var(--warn); }

  .chip { font-family:var(--mono); font-size:11.5px; font-weight:700; padding:4px 9px; border-radius:2px; white-space:nowrap;
          border:1px solid transparent; display:inline-block; }
  .chip.buy   { color:var(--good); background:var(--goodBg); border-color:var(--good); }
  .chip.fair  { color:var(--accentInk); background:var(--accBg); border-color:var(--accent); }
  .chip.high  { color:var(--warn); background:var(--warnBg); border-color:var(--warn); }
  .chip.alert { color:var(--crit); background:var(--critBg); border-color:var(--crit); }
  .chip.tag   { color:var(--soft); background:transparent; border-color:var(--line); font-weight:600; }

  .track { position:relative; height:10px; border:1px solid var(--line); background:var(--panel); }
  .seg { position:absolute; top:0; bottom:0; opacity:.5; }
  .seg.g { background:var(--good); } .seg.b { background:var(--accent); } .seg.y { background:var(--warn); }
  .mark { position:absolute; top:50%; width:9px; height:9px; border-radius:50%; background:var(--ink);
          border:2px solid var(--panel); transform:translate(-50%,-50%); }
  .keys { display:flex; justify-content:space-between; font-family:var(--mono); font-size:10px; color:var(--faint); margin-top:4px; gap:6px; flex-wrap:wrap; }
  .keys .kg { color:var(--good); } .keys .ky { color:var(--warn); }

  .right { padding:10px 14px 12px; min-width:0; }
  .ptabs { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:6px; }
  .ptab { font-family:var(--mono); font-size:11px; font-weight:700; padding:3px 9px; border:1px solid var(--line);
          background:var(--panel); color:var(--soft); cursor:pointer; border-radius:2px; }
  .ptab.on { color:var(--accentInk); border-color:var(--accent); background:var(--accBg); }
  .chartwrap { position:relative; }
  .chartwrap svg { display:block; width:100%; height:auto; }
  .cstatus { font-family:var(--mono); font-size:11px; color:var(--faint); padding:28px 0; text-align:center; }
  .tip { position:absolute; pointer-events:none; display:none; background:var(--panel); border:1px solid var(--lineS);
         font-family:var(--mono); font-size:11px; padding:4px 8px; border-radius:2px; color:var(--ink); box-shadow:var(--shadow); white-space:nowrap; z-index:2; }

  footer { padding:12px clamp(12px,2.5vw,24px); border-top:1px solid var(--line); background:var(--panel2);
           font-family:var(--mono); font-size:10.5px; color:var(--faint); line-height:1.7; }

  @media (max-width:760px) {
    .card { grid-template-columns:1fr; }
    .left { border-right:none; border-bottom:1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="sheet">
  <header>
    <div>
      <div class="eyebrow">Watchlist · Bands from Research Reports</div>
      <h1>投研看盘</h1>
    </div>
    <div class="hdr-right">
      <div><span class="dot" id="live-dot"></span><span id="last-refresh">连接中…</span></div>
      <div id="bands-updated"></div>
      <button class="theme" id="theme-btn" type="button">切换主题</button>
    </div>
  </header>

  <section id="groups"></section>

  <footer>
    数据:Boursorama(巴黎股实时;米兰等按其页面时效)· 某标的失败时自动以 Yahoo 补位(标注「备用源 · 延迟15分」)· 报价每 15 秒刷新,1J/5J 为分钟粒度<br>
    价位带来自 Obsidian 库研究报告(bands.json,随报告更新)· 🟢 偏低可入场 / 🔵 合理 / 🟡 偏高 / 🔴 信号离场 · 走势图虚线 = 入场/离场阈值 · 研究/学习用途,非投资建议
  </footer>
</div>

<script>
const GROUP_TITLES = { stocks: "个股", etf: "ETF", index: "指数参考" };
const PERIODS = ["1J","5J","1M","3M","6M","1A","5A","10A"];
const DEFAULT_PERIOD = "1J";
const POLL_MS = 15000;
let BANDS = null;
const histCache = {}; // code|period -> {at, points}
const curPeriod = {}; // code -> period

const fmtPrice = (v, cur) => v == null ? "—" : (cur || "") + v.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: v < 10 ? 3 : 2 });
const pctCls = p => p == null ? "flat" : p > 0.001 ? "up" : p < -0.001 ? "dn" : "flat";
const fmtPct = p => p == null ? "" : (p > 0 ? "▲+" : p < 0 ? "▼" : "") + p.toFixed(2) + "%";

function statusOf(inst, price) {
  if (inst.alert) return { cls: "alert", label: "🔴 " + inst.alert };
  if (inst.green == null && inst.yellow == null) return { cls: "tag", label: inst.tag || "带未定 · 仅价格" };
  if (price == null) return { cls: "tag", label: "等待数据" };
  if (inst.strong != null && price <= inst.strong) return { cls: "buy", label: "🟢 强买区" };
  if (inst.green != null && price <= inst.green) return { cls: "buy", label: "🟢 可入场" };
  if (inst.yellow != null && price >= inst.yellow) return { cls: "high", label: "🟡 偏高" };
  return { cls: "fair", label: "🔵 合理" };
}

function rulerHtml(inst) {
  if (!inst.axis) return "";
  const [a0, a1] = inst.axis, span = a1 - a0;
  const pos = v => Math.max(0, Math.min(100, ((v - a0) / span) * 100));
  const g = inst.green != null ? pos(inst.green) : 0;
  const y = inst.yellow != null ? pos(inst.yellow) : 100;
  return `<div>
  <div class="track">
    <div class="seg g" style="left:0%; width:${g}%"></div>
    <div class="seg b" style="left:${g}%; width:${Math.max(0, y - g)}%"></div>
    <div class="seg y" style="left:${y}%; width:${Math.max(0, 100 - y)}%"></div>
    <div class="mark" data-mark="${inst.code}" style="left:0%; display:none;"></div>
  </div>
  <div class="keys">
    <span class="kg">入场 ≤${inst.green}${inst.strong != null ? " · 重仓 ≤" + inst.strong : ""}</span>
    <span class="ky">${inst.code === "1gISP" ? "离场 ≥7.6(带 ≥" + inst.yellow + ")" : "离场 ≥" + inst.yellow}</span>
  </div></div>`;
}

function build() {
  const root = document.getElementById("groups");
  const order = ["stocks", "etf", "index"];
  root.innerHTML = order.map(gr => {
    const rows = BANDS.instruments.filter(i => i.group === gr).map(inst => `
      <div class="card" id="card-${inst.code}">
        <div class="left">
          <div class="who">
            <div class="nm">${inst.name}</div>
            <div class="cd">${inst.short} · ${inst.code}${inst.report ? " · 报告:" + inst.report : ""}</div>
            ${inst.watch ? `<div class="watch">👁 ${inst.watch}</div>` : ""}
          </div>
          <div class="pxline">
            <span class="px"><span class="p" data-price="${inst.code}">—</span><span class="chg flat" data-chg="${inst.code}"></span></span>
            <span class="chip tag" data-chip="${inst.code}">…</span>
          </div>
          <div class="meta" data-meta="${inst.code}"></div>
          ${rulerHtml(inst)}
        </div>
        <div class="right">
          <div class="ptabs" data-ptabs="${inst.code}">
            ${PERIODS.map(p => `<button class="ptab${p === DEFAULT_PERIOD ? " on" : ""}" type="button" data-period="${p}">${p}</button>`).join("")}
          </div>
          <div class="chartwrap" data-chartwrap="${inst.code}">
            <div class="cstatus">加载中…</div>
            <div class="tip" data-tip="${inst.code}"></div>
          </div>
        </div>
      </div>`).join("");
    return `<div class="sec-label"><span class="txt">${GROUP_TITLES[gr]}</span><span class="rule"></span></div>${rows}`;
  }).join("");
  document.getElementById("bands-updated").textContent = "价位带更新:" + BANDS.updated;

  document.querySelectorAll("[data-ptabs]").forEach(tabs => {
    tabs.addEventListener("click", e => {
      const b = e.target.closest(".ptab");
      if (!b) return;
      tabs.querySelectorAll(".ptab").forEach(x => x.classList.toggle("on", x === b));
      loadChart(tabs.dataset.ptabs, b.dataset.period);
    });
  });
  // 默认全部加载(轻微错峰,避免瞬时 9 个并发)
  BANDS.instruments.forEach((inst, i) => setTimeout(() => loadChart(inst.code, DEFAULT_PERIOD), i * 120));
}

async function loadChart(code, period) {
  curPeriod[code] = period;
  const wrap = document.querySelector(`[data-chartwrap="${code}"]`);
  const key = code + "|" + period;
  const hit = histCache[key];
  if (hit && Date.now() - hit.at < 60_000) return drawChart(code, period, hit.points);
  try {
    const res = await fetch(`/api/history?code=${code}&period=${period}`);
    if (!res.ok) throw new Error(res.status);
    const j = await res.json();
    histCache[key] = { at: Date.now(), points: j.points };
    if (curPeriod[code] === period) drawChart(code, period, j.points);
  } catch (e) {
    wrap.querySelector("svg")?.remove();
    wrap.querySelectorAll(".cstatus").forEach(n => n.remove());
    wrap.insertAdjacentHTML("afterbegin", '<div class="cstatus">走势数据暂不可用,稍后重试</div>');
  }
}

function drawChart(code, period, points) {
  const inst = BANDS.instruments.find(i => i.code === code);
  const wrap = document.querySelector(`[data-chartwrap="${code}"]`);
  wrap.querySelectorAll(".cstatus").forEach(n => n.remove());
  wrap.querySelector("svg")?.remove();
  if (!points || points.length < 2) {
    wrap.insertAdjacentHTML("afterbegin", '<div class="cstatus">无数据</div>');
    return;
  }
  const W = 720, H = 168, padL = 8, padR = 62, padT = 12, padB = 20;
  const xs = points.map(p => p.t), ys = points.map(p => p.c);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  const thresholds = [];
  if (inst.green != null && inst.green > lo * 0.85 && inst.green < hi * 1.15) thresholds.push({ v: inst.green, cls: "g" });
  if (inst.yellow != null && inst.yellow > lo * 0.85 && inst.yellow < hi * 1.15) thresholds.push({ v: inst.yellow, cls: "y" });
  thresholds.forEach(t => { lo = Math.min(lo, t.v); hi = Math.max(hi, t.v); });
  const spanY = (hi - lo) || 1; lo -= spanY * 0.06; hi += spanY * 0.06;
  const t0 = xs[0], t1 = xs[xs.length - 1], spanX = (t1 - t0) || 1;
  const X = t => padL + ((t - t0) / spanX) * (W - padL - padR);
  const Y = v => padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB);
  const line = points.map((p, i) => (i ? "L" : "M") + X(p.t).toFixed(1) + " " + Y(p.c).toFixed(1)).join(" ");
  const area = line + ` L ${X(t1).toFixed(1)} ${(H - padB).toFixed(1)} L ${X(t0).toFixed(1)} ${(H - padB).toFixed(1)} Z`;
  const gridVals = [0.25, 0.5, 0.75].map(f => lo + (hi - lo) * f);
  const fmtT = t => {
    const d = new Date(t);
    return (period === "1J" || period === "5J")
      ? (period === "5J" ? String(d.getUTCDate()).padStart(2, "0") + "/" + String(d.getUTCMonth() + 1).padStart(2, "0") + " " : "") +
        String(d.getUTCHours()).padStart(2, "0") + ":" + String(d.getUTCMinutes()).padStart(2, "0")
      : String(d.getUTCDate()).padStart(2, "0") + "/" + String(d.getUTCMonth() + 1).padStart(2, "0") + (["1A","5A","10A"].includes(period) ? "/" + String(d.getUTCFullYear()).slice(2) : "");
  };
  const last = points[points.length - 1];
  const thLines = thresholds.map(t =>
    `<line x1="${padL}" x2="${W - padR}" y1="${Y(t.v).toFixed(1)}" y2="${Y(t.v).toFixed(1)}" stroke="${t.cls === "g" ? "var(--good)" : "var(--warn)"}" stroke-width="1" stroke-dasharray="5 4" opacity=".75"/>
     <text x="${W - padR + 4}" y="${(Y(t.v) + 3.5).toFixed(1)}" font-size="10" fill="${t.cls === "g" ? "var(--good)" : "var(--warn)"}" font-family="var(--mono)">${t.cls === "g" ? "入场" : "离场"} ${t.v}</text>`).join("");
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${inst.name} ${period} 走势">
    ${gridVals.map(v => `<line x1="${padL}" x2="${W - padR}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1" opacity=".6"/>
      <text x="${W - padR + 4}" y="${(Y(v) + 3.5).toFixed(1)}" font-size="9.5" fill="var(--faint)" font-family="var(--mono)">${v.toFixed(v < 10 ? 2 : v < 1000 ? 1 : 0)}</text>`).join("")}
    <path d="${area}" fill="var(--areaFill)"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    ${thLines}
    <circle cx="${X(last.t).toFixed(1)}" cy="${Y(last.c).toFixed(1)}" r="3.5" fill="var(--accent)" stroke="var(--panel)" stroke-width="1.5"/>
    <text x="${W - padR + 4}" y="${(Y(last.c) + 3.5).toFixed(1)}" font-size="10.5" font-weight="700" fill="var(--accentInk)" font-family="var(--mono)">${last.c.toFixed(last.c < 10 ? 3 : 2)}</text>
    <text x="${padL}" y="${H - 5}" font-size="9.5" fill="var(--faint)" font-family="var(--mono)">${fmtT(t0)}</text>
    <text x="${W - padR}" y="${H - 5}" font-size="9.5" fill="var(--faint)" font-family="var(--mono)" text-anchor="end">${fmtT(t1)}</text>
    <line data-cross x1="0" x2="0" y1="${padT}" y2="${H - padB}" stroke="var(--lineS)" stroke-width="1" opacity="0"/>
    <circle data-crossdot r="3" fill="var(--ink)" opacity="0"/>
  </svg>`;
  wrap.insertAdjacentHTML("afterbegin", svg);

  const svgEl = wrap.querySelector("svg");
  const tip = wrap.querySelector(`[data-tip="${code}"]`);
  const cross = svgEl.querySelector("[data-cross]");
  const crossDot = svgEl.querySelector("[data-crossdot]");
  svgEl.addEventListener("mousemove", ev => {
    const r = svgEl.getBoundingClientRect();
    const mx = ((ev.clientX - r.left) / r.width) * W;
    const t = t0 + ((mx - padL) / (W - padL - padR)) * spanX;
    let best = points[0], bd = Infinity;
    for (const p of points) { const d = Math.abs(p.t - t); if (d < bd) { bd = d; best = p; } }
    cross.setAttribute("x1", X(best.t)); cross.setAttribute("x2", X(best.t)); cross.setAttribute("opacity", ".7");
    crossDot.setAttribute("cx", X(best.t)); crossDot.setAttribute("cy", Y(best.c)); crossDot.setAttribute("opacity", "1");
    tip.style.display = "block";
    tip.style.left = Math.min(((X(best.t) / W) * r.width) + 10, r.width - 150) + "px";
    tip.style.top = ((Y(best.c) / H) * r.height - 30) + "px";
    tip.textContent = fmtT(best.t) + " · " + (inst.currency || "") + best.c.toFixed(best.c < 10 ? 3 : 2);
  });
  svgEl.addEventListener("mouseleave", () => {
    tip.style.display = "none"; cross.setAttribute("opacity", "0"); crossDot.setAttribute("opacity", "0");
  });
}

function applyQuotes(payload) {
  const now = new Date();
  let anyOk = false;
  for (const inst of BANDS.instruments) {
    const q = payload.data[inst.code];
    if (!q) continue;
    const priceEl = document.querySelector(`[data-price="${inst.code}"]`);
    const chgEl = document.querySelector(`[data-chg="${inst.code}"]`);
    const metaEl = document.querySelector(`[data-meta="${inst.code}"]`);
    const chipEl = document.querySelector(`[data-chip="${inst.code}"]`);
    const markEl = document.querySelector(`[data-mark="${inst.code}"]`);
    if (q.price != null) {
      anyOk = true;
      priceEl.textContent = fmtPrice(q.price, inst.currency);
      chgEl.textContent = fmtPct(q.pct);
      chgEl.className = "chg " + pctCls(q.pct);
      const bits = [];
      if (q.src === "yahoo") bits.push('<span class="warnsrc">备用源 · 延迟15分</span>');
      if (q.stale) bits.push('<span class="warnsrc">数据滞留 ' + new Date(q.t * 1000).toLocaleTimeString("fr-FR", {hour:"2-digit",minute:"2-digit"}) + "</span>");
      metaEl.innerHTML = bits.join(" · ");
      const st = statusOf(inst, q.price);
      chipEl.className = "chip " + st.cls;
      chipEl.textContent = st.label;
      if (markEl && inst.axis) {
        const [a0, a1] = inst.axis;
        const p = Math.max(0, Math.min(100, ((q.price - a0) / (a1 - a0)) * 100));
        markEl.style.left = p + "%";
        markEl.style.display = "block";
      }
    }
  }
  const dot = document.getElementById("live-dot");
  dot.className = "dot" + (anyOk ? "" : " err");
  document.getElementById("last-refresh").textContent =
    "最后刷新 " + now.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}

async function poll() {
  try {
    const res = await fetch("/api/quotes", { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    applyQuotes(await res.json());
  } catch (e) {
    document.getElementById("live-dot").className = "dot err";
    document.getElementById("last-refresh").textContent = "刷新失败,重试中…";
  }
}

document.getElementById("theme-btn").addEventListener("click", () => {
  const r = document.documentElement;
  const cur = r.getAttribute("data-theme") ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  r.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
});

fetch("bands.json").then(r => r.json()).then(b => {
  BANDS = b;
  build();
  poll();
  setInterval(poll, POLL_MS);
});
</script>
